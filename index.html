<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>7桁番号OCR（中央トリミング）</title>
<script>
  const employeeData = [];
</script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
    }

    /* input を隠す */
    #cameraInput {
      display: none;
    }

    /* 大きなカメラボタン */
    .camera-button {
      display: inline-block;
      padding: 18px 28px;
      background-color: #007aff;
      color: white;
      font-size: 20px;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      margin-bottom: 15px;
    }

    img {
      max-width: 100%;
      margin-top: 10px;
      border: 1px solid #ccc;
    }

    /* ★ 結果を大きく・目立たせる */
    #result {
      margin-top: 20px;
      padding: 16px;
      border: 2px solid #007aff;
      background: #f0f6ff;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

<h2>📷 7桁番号 読み取り（中央トリミング）</h2>

<label for="cameraInput" class="camera-button">
  カメラを起動する
</label>

<input
  type="file"
  accept="image/*"
  capture="environment"
  id="cameraInput"
/>

<!-- 結果を画像より上に -->
<div id="result">ここに結果が表示されます</div>

<p>※ 数字が画面中央に来るように撮影してください</p>

<img id="preview" />
<img id="croppedPreview" />

<script>
  const input = document.getElementById("cameraInput");
  const preview = document.getElementById("preview");
  const croppedPreview = document.getElementById("croppedPreview");
  const result = document.getElementById("result");

  input.addEventListener("change", () => {
    const file = input.files[0];
    if (!file) return;

    const img = new Image();
    img.src = URL.createObjectURL(file);

    preview.src = img.src;
    result.textContent = "⏳ 読み取り中…";

    img.onload = async () => {
      // ===== 中央トリミング設定 =====
      const cropWidthRatio = 0.6;   // 横60%
      const cropHeightRatio = 0.25; // 縦25%

      const cropWidth = img.width * cropWidthRatio;
      const cropHeight = img.height * cropHeightRatio;

      const cropX = (img.width - cropWidth) / 2;
      const cropY = (img.height - cropHeight) / 2;

      // ===== canvasで切り抜き =====
      const canvas = document.createElement("canvas");
      canvas.width = cropWidth;
      canvas.height = cropHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(
        img,
        cropX,
        cropY,
        cropWidth,
        cropHeight,
        0,
        0,
        cropWidth,
        cropHeight
      );

      const croppedDataUrl = canvas.toDataURL("image/png");
      croppedPreview.src = croppedDataUrl;

      try {
        const { data } = await Tesseract.recognize(
          croppedDataUrl,
          "eng",
          {
            logger: m => console.log(m),
            tessedit_char_whitelist: "0123456789"
          }
        );

        // 数字以外を除去して7桁チェック
        const numbersOnly = data.text.replace(/\D/g, "");
        const match = numbersOnly.match(/\d{7}/);

       if (match) {
  const code = match[0];  // OCRで読み取った7桁

  // ★ ここで employeeData と照合する
  const hit = employeeData.find(e => e.id === code);

  if (hit) {
    result.textContent = `✅ ${code} / ${hit.name} / ${hit.renban}`;
  } else {
    result.textContent = `❌ ${code} は登録されていません`;
  }

} else {
  result.textContent = "❌ 7桁の数字が見つかりませんでした。";
}

      } catch (e) {
        result.textContent = "❌ OCRエラーが発生しました";
        console.error(e);
      }
    };
  });
</script>

</body>
</html>
