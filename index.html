<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>7桁番号OCR（中央トリミング）</title>
<script>
  const employeeData = [];
</script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
    }

    /* input を隠す */
    #cameraInput {
      display: none;
    }

    /* 大きなカメラボタン */
    .camera-button {
      display: inline-block;
      padding: 18px 28px;
      background-color: #007aff;
      color: white;
      font-size: 20px;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      margin-bottom: 15px;
    }

    img {
      max-width: 100%;
      margin-top: 10px;
      border: 1px solid #ccc;
    }

    /* ★ 結果を大きく・目立たせる */
    #result {
      margin-top: 20px;
      padding: 16px;
      border: 2px solid #007aff;
      background: #f0f6ff;
      font-size: 24px;
      font-weight: bold;
      text-align: center;
    }

    #debugInfo {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<h2>📷 7桁番号 読み取り（中央トリミング）</h2>

<label for="cameraInput" class="camera-button">
  カメラを起動する
</label>

<input
  type="file"
  accept="image/*"
  capture="environment"
  id="cameraInput"
/>

<!-- 結果を画像より上に -->
<div id="result">ここに結果が表示されます</div>
<div id="debugInfo"></div>

<p>※ 数字が画面中央に来るように撮影してください</p>

<img id="preview" />
<img id="croppedPreview" />

<script>
  const input = document.getElementById("cameraInput");
  const preview = document.getElementById("preview");
  const croppedPreview = document.getElementById("croppedPreview");
  const result = document.getElementById("result");
  const debugInfo = document.getElementById("debugInfo");

  // ===== 画像前処理: グレースケール化 + 二値化（コントラストをはっきりさせる） =====
  function binarize(ctx, width, height, thresholdOffset = 0.85) {
    const imgData = ctx.getImageData(0, 0, width, height);
    const data = imgData.data;

    // まずグレースケール化して平均輝度を求める（適応的しきい値のため）
    let sum = 0;
    const grays = new Uint8ClampedArray(width * height);
    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
      const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      grays[p] = gray;
      sum += gray;
    }
    const avg = sum / grays.length;
    const threshold = avg * thresholdOffset;

    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
      const v = grays[p] < threshold ? 0 : 255;
      data[i] = data[i + 1] = data[i + 2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
  }

  // ===== 指定したpsmモードでOCRを実行 =====
  async function runOCR(dataUrl, psm) {
    const { data } = await Tesseract.recognize(dataUrl, "eng", {
      tessedit_char_whitelist: "0123456789",
      tessedit_pageseg_mode: psm
    });
    const numbersOnly = data.text.replace(/\D/g, "");
    const match = numbersOnly.match(/\d{7}/);
    return { match: match ? match[0] : null, confidence: data.confidence, raw: data.text };
  }

  input.addEventListener("change", () => {
    const file = input.files[0];
    if (!file) return;

    const img = new Image();
    img.src = URL.createObjectURL(file);

    preview.src = img.src;
    result.textContent = "⏳ 読み取り中…";
    debugInfo.textContent = "";

    img.onload = async () => {
      // ===== 中央トリミング設定 =====
      const cropWidthRatio = 0.6;   // 横60%
      const cropHeightRatio = 0.25; // 縦25%

      const cropWidth = img.width * cropWidthRatio;
      const cropHeight = img.height * cropHeightRatio;

      const cropX = (img.width - cropWidth) / 2;
      const cropY = (img.height - cropHeight) / 2;

      // ===== canvasで切り抜き =====
      const canvas = document.createElement("canvas");
      canvas.width = cropWidth;
      canvas.height = cropHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(
        img,
        cropX,
        cropY,
        cropWidth,
        cropHeight,
        0,
        0,
        cropWidth,
        cropHeight
      );

      // ===== 拡大（アップスケール）してOCR精度を上げる =====
      const scale = 3;
      const upCanvas = document.createElement("canvas");
      upCanvas.width = cropWidth * scale;
      upCanvas.height = cropHeight * scale;
      const upCtx = upCanvas.getContext("2d");
      upCtx.imageSmoothingEnabled = true;
      upCtx.imageSmoothingQuality = "high";
      upCtx.drawImage(canvas, 0, 0, upCanvas.width, upCanvas.height);

      // ===== グレースケール化＋二値化 =====
      binarize(upCtx, upCanvas.width, upCanvas.height);

      const processedDataUrl = upCanvas.toDataURL("image/png");
      croppedPreview.src = processedDataUrl;

      try {
        // まず単一行モードで試す。ダメなら別モードで再試行。
        const psmModes = [7, 6, 8];
        let best = null;

        for (const psm of psmModes) {
          const attempt = await runOCR(processedDataUrl, psm);
          if (attempt.match) {
            best = attempt;
            break;
          }
          if (!best || (attempt.confidence ?? 0) > (best.confidence ?? 0)) {
            best = attempt;
          }
        }

        debugInfo.textContent = `(認識文字列: "${best.raw.trim()}" / 信頼度: ${Math.round(best.confidence || 0)}%)`;

        if (best.match) {
          const code = best.match;
          const hit = employeeData.find(e => e.id === code);

          if (hit) {
            result.textContent = `✅ ${code} / ${hit.name} / ${hit.renban}`;
          } else {
            result.textContent = `❌ ${code} は登録されていません`;
          }
        } else {
          result.textContent = "❌ 7桁の数字が見つかりませんでした。";
        }

      } catch (e) {
        result.textContent = "❌ OCRエラーが発生しました";
        console.error(e);
      }
    };
  });
</script>

</body>
</html>
