<body>

<h2>📷 7桁番号 読み取り（中央トリミング）</h2>

<label for="cameraInput" class="camera-button">
  カメラを起動する
</label>

<input
  type="file"
  accept="image/*"
  capture="environment"
  id="cameraInput"
/>

<!-- 結果を画像より上に -->
<div id="result">ここに結果が表示されます</div>
<div id="debugInfo"></div>

<p>※ 数字が画面中央に来るように撮影してください</p>

<div class="preview-wrapper">
  <img id="preview" />
  <div id="cropOverlay"></div>
</div>
<img id="croppedPreview" />

<script>
  const input = document.getElementById("cameraInput");
  const preview = document.getElementById("preview");
  const croppedPreview = document.getElementById("croppedPreview");
  const result = document.getElementById("result");
  const debugInfo = document.getElementById("debugInfo");
  const cropOverlay = document.getElementById("cropOverlay");

  // ===== 中央トリミング設定（枠表示とトリミング処理の両方でこの値を使う） =====
  const cropWidthRatio = 0.6;   // 横60%
  const cropHeightRatio = 0.25; // 縦25%

  // 信頼度がこれ未満の場合は結果を採用しない（誤読と判断）
  const CONFIDENCE_THRESHOLD = 55;

  // 枠の位置・サイズを設定（画像の表示サイズに対する%指定なので、常に正しい位置に出る）
  cropOverlay.style.left = ((1 - cropWidthRatio) / 2 * 100) + "%";
  cropOverlay.style.top = ((1 - cropHeightRatio) / 2 * 100) + "%";
  cropOverlay.style.width = (cropWidthRatio * 100) + "%";
  cropOverlay.style.height = (cropHeightRatio * 100) + "%";

  // ===== 画像前処理: グレースケール化 + 二値化（コントラストをはっきりさせる） =====
  function binarize(ctx, width, height, thresholdOffset = 0.85) {
    const imgData = ctx.getImageData(0, 0, width, height);
    const data = imgData.data;

    // まずグレースケール化して平均輝度を求める（適応的しきい値のため）
    let sum = 0;
    const grays = new Uint8ClampedArray(width * height);
    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
      const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      grays[p] = gray;
      sum += gray;
    }
    const avg = sum / grays.length;
    const threshold = avg * thresholdOffset;

    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
      const v = grays[p] < threshold ? 0 : 255;
      data[i] = data[i + 1] = data[i + 2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
  }

  // ===== 指定したpsmモードでOCRを実行 =====
  async function runOCR(dataUrl, psm) {
    const { data } = await Tesseract.recognize(dataUrl, "eng", {
      tessedit_char_whitelist: "0123456789",
      tessedit_pageseg_mode: psm
    });
    const numbersOnly = data.text.replace(/\D/g, "");
    const match = numbersOnly.match(/\d{7}/);
    return { match: match ? match[0] : null, confidence: data.confidence || 0, raw: data.text };
  }

  input.addEventListener("change", () => {
    const file = input.files[0];
    if (!file) return;

    const img = new Image();
    img.src = URL.createObjectURL(file);

    preview.src = img.src;
    cropOverlay.style.display = "block";
    result.textContent = "⏳ 読み取り中…";
    debugInfo.textContent = "";

    img.onload = async () => {
      const cropWidth = img.width * cropWidthRatio;
      const cropHeight = img.height * cropHeightRatio;

      const cropX = (img.width - cropWidth) / 2;
      const cropY = (img.height - cropHeight) / 2;

      // ===== canvasで切り抜き =====
      const canvas = document.createElement("canvas");
      canvas.width = cropWidth;
      canvas.height = cropHeight;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(
        img,
        cropX,
        cropY,
        cropWidth,
        cropHeight,
        0,
        0,
        cropWidth,
        cropHeight
      );

      // ===== 拡大（アップスケール）してOCR精度を上げる =====
      const scale = 3;
      const upCanvas = document.createElement("canvas");
      upCanvas.width = cropWidth * scale;
      upCanvas.height = cropHeight * scale;
      const upCtx = upCanvas.getContext("2d");
      upCtx.imageSmoothingEnabled = true;
      upCtx.imageSmoothingQuality = "high";
      upCtx.drawImage(canvas, 0, 0, upCanvas.width, upCanvas.height);

      // ===== グレースケール化＋二値化 =====
      binarize(upCtx, upCanvas.width, upCanvas.height);

      const processedDataUrl = upCanvas.toDataURL("image/png");
      croppedPreview.src = processedDataUrl;

      try {
        // 複数モードすべて試して、一番信頼度が高い結果を採用する
        const psmModes = [7, 6, 8];
        const attempts = [];
        for (const psm of psmModes) {
          attempts.push(await runOCR(processedDataUrl, psm));
        }

        // 7桁の数字が取れたものだけを対象に、信頼度が一番高いものを選ぶ
        const validAttempts = attempts.filter(a => a.match);
        const best = validAttempts.length
          ? validAttempts.reduce((a, b) => (a.confidence >= b.confidence ? a : b))
          : attempts.reduce((a, b) => (a.confidence >= b.confidence ? a : b));

        debugInfo.textContent = `(認識文字列: "${best.raw.trim()}" / 信頼度: ${Math.round(best.confidence)}%)`;

        if (best.match && best.confidence >= CONFIDENCE_THRESHOLD) {
          const code = best.match;
          const hit = employeeData.find(e => e.id === code);

          if (hit) {
            result.textContent = `✅ ${code} / ${hit.name} / ${hit.renban}`;
          } else {
            result.textContent = `❌ ${code} は登録されていません`;
          }
        } else if (best.match) {
          result.textContent = `⚠️ 読み取り精度が低いです（候補: ${best.match}）。撮り直してください`;
        } else {
          result.textContent = "❌ 7桁の数字が見つかりませんでした。撮り直してください";
        }

      } catch (e) {
        result.textContent = "❌ OCRエラーが発生しました";
        console.error(e);
      }
    };
  });
</script>
